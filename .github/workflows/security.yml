name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request' && vars.ENABLE_GITHUB_ADVANCED_SECURITY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  codeql:
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install vulnerability and SBOM tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gobin"
          echo "$RUNNER_TEMP/gobin" >> "$GITHUB_PATH"
          GOBIN="$RUNNER_TEMP/gobin" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          GOBIN="$RUNNER_TEMP/gobin" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
      - name: Audit every Go module
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' go_modules < <(find . \( -type d \( -name .git -o -name node_modules \) -prune \) -o -type f -name go.mod -print0)
          if (( ${#go_modules[@]} == 0 )); then
            echo 'No Go modules found.'
            exit 0
          fi
          for go_mod in "${go_modules[@]}"; do
            module_dir="${go_mod%/go.mod}"
            packages=$(cd "$module_dir" && GOWORK=off go list ./...)
            if [[ -z "$packages" ]]; then
              echo "Skipping Go module without packages: $module_dir"
              continue
            fi
            (cd "$module_dir" && GOWORK=off govulncheck -test ./...)
          done
      - name: Audit every npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' npm_locks < <(find . \( -type d \( -name .git -o -name node_modules \) -prune \) -o -type f -name package-lock.json -print0)
          if (( ${#npm_locks[@]} == 0 )); then
            echo 'No npm lockfiles found.'
            exit 0
          fi
          for npm_lock in "${npm_locks[@]}"; do
            npm audit --prefix "$(dirname "$npm_lock")"
          done
      - name: Generate and verify SBOM coverage
        shell: bash
        run: |
          set -euo pipefail
          sbom_dir="$RUNNER_TEMP/sbom"
          mkdir -p "$sbom_dir"
          mapfile -d '' go_modules < <(find . \( -type d \( -name .git -o -name node_modules \) -prune \) -o -type f -name go.mod -print0)
          mapfile -d '' npm_locks < <(find . \( -type d \( -name .git -o -name node_modules \) -prune \) -o -type f -name package-lock.json -print0)
          generated=0
          for go_mod in "${go_modules[@]}"; do
            module_dir="${go_mod%/go.mod}"
            packages=$(cd "$module_dir" && GOWORK=off go list ./...)
            if [[ -z "$packages" ]]; then
              continue
            fi
            cyclonedx-gomod mod -json -output "$sbom_dir/go-$generated.cdx.json" "$module_dir"
            ((generated += 1))
          done
          for npm_lock in "${npm_locks[@]}"; do
            npm exec --yes --package=@cyclonedx/cyclonedx-npm@6.0.1 -- cyclonedx-npm --output-file "$sbom_dir/npm-$generated.cdx.json" --package-lock-only "$(dirname "$npm_lock")/package.json"
            ((generated += 1))
          done
          actual=$(find "$sbom_dir" -type f -name '*.cdx.json' -print | wc -l | tr -d ' ')
          if (( actual != generated )); then
            echo "SBOM coverage mismatch: generated $actual of $generated expected files." >&2
            exit 1
          fi
          while IFS= read -r -d '' sbom; do
            jq -e '.bomFormat == "CycloneDX" and (.components | type == "array") and (.components | length > 0)' "$sbom" >/dev/null
          done < <(find "$sbom_dir" -type f -name '*.cdx.json' -print0)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyclonedx-sboms
          path: ${{ runner.temp }}/sbom/*.cdx.json
          if-no-files-found: error

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Scan full Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gobin"
          GOBIN="$RUNNER_TEMP/gobin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$RUNNER_TEMP/gobin/gitleaks" git . --redact --no-banner
